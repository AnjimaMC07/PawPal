<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Details | PawPal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand brand">🐾 PawPal</a>
      <a href="pets.html" class="btn btn-outline-paw">← All Pets</a>
    </div>
  </nav>

  <section class="section-padding">
    <div class="container">
      <div class="row align-items-center g-5">
        <div class="col-lg-6">
          <img id="petImage" class="hero-img" src="" alt="Selected pet">
        </div>

        <div class="col-lg-6">
          <span id="petCategory" class="pet-category"></span>
          <h1 id="petName" class="fw-bold mt-3"></h1>
          <p id="petMeta" class="pet-meta"></p>
          <p id="petDescription" class="lead"></p>

          <div class="about-box p-4 my-4">
            <p><strong>Health details:</strong> Contact the adoption team.</p>
            <p><strong>Personality:</strong> Friendly and playful (sample profile).</p>
            <p class="mb-0"><strong>Status:</strong> Looking for a home</p>
          </div>

          <a id="adoptLink" href="adoption.html" class="btn btn-paw">Apply to Adopt</a>
        </div>
      </div>
    </div>
  </section>

  <footer class="text-center">
    <div class="container"><h4>🐾 PawPal</h4><p>Find a friend. Share a lifetime of love.</p></div>
  </footer>

  <script>
    const pets = {
      Buddy: {
        category: "Dog",
        meta: "Golden Retriever · 2 years",
        description: "A friendly and playful companion who loves walks.",
        image: "https://images.unsplash.com/photo-1552053831-71594a27632d?w=900"
      },
      Luna: {
        category: "Cat",
        meta: "Persian Cat · 1 year",
        description: "A calm and adorable cat looking for a loving family.",
        image: "https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=900"
      },
      Max: {
        category: "Dog",
        meta: "Beagle · 8 months",
        description: "An energetic puppy who loves playing with people.",
        image: "https://images.unsplash.com/photo-1507146426996-ef05306b995a?w=900"
      },
      Milo: {
        category: "Cat",
        meta: "Domestic Cat · 6 months",
        description: "A curious little friend ready to explore a new home.",
        image: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=900"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const selectedName = params.get("pet");
    const pet = pets[selectedName] || pets.Buddy;
    const petName = pets[selectedName] ? selectedName : "Buddy";

    document.getElementById("petName").textContent = petName;
    document.getElementById("petCategory").textContent = pet.category;
    document.getElementById("petMeta").textContent = pet.meta;
    document.getElementById("petDescription").textContent = pet.description;
    document.getElementById("petImage").src = pet.image;
    document.getElementById("petImage").alt = petName;

    document.getElementById("adoptLink").href =
      "adoption.html?pet=" + encodeURIComponent(petName);

    document.title = petName + " | PawPal";
  </script>
</body>
</html>
